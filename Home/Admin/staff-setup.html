<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Account Setup | Drin Electronics</title>

    <link rel="icon" type="image/png"
        href="https://zdinvxowzpkolbfzpcac.supabase.co/storage/v1/object/public/product-images/logo.png">

    <link rel="stylesheet" href="../login/login.css?v=50003">
    <link rel="stylesheet" href="./staff-setup.css?v=10001">
</head>

<body>

    <div class="login-container">
        <div class="login-card">

            <h1>Staff Account Setup</h1>

            <p class="subtitle">
                Welcome to Drin Electronics.
                Set your password to activate your staff account.
            </p>

            <form id="staffSetupForm">

                <div class="password-group">
                    <input type="password" id="staffPassword" placeholder="New Password" minlength="8"
                        autocomplete="new-password" required>
                </div>

                <div class="password-group">
                    <input type="password" id="staffConfirmPassword" placeholder="Confirm Password" minlength="8"
                        autocomplete="new-password" required>
                </div>

                <button type="submit" class="login-btn" id="staffSetupBtn" disabled>
                    Set Password
                </button>

            </form>

            <p id="staffSetupMessage" role="status" aria-live="polite" style="margin-top:16px;text-align:center;">
                Verifying invitation...
            </p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="./supabase.js?v=10010"></script>
    <script src="./staff-setup.js?v=10001"></script>

</body>

</html>
